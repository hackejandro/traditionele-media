<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Commonplace — Waar mensen over praten.">
  <title>Commonplace</title>
  <style>
    :root{--page:#f4f5f1;--surface:#fff;--soft:#e8f2ea;--text:#182019;--muted:#687169;--border:#dce2dc;--accent:#246243}*{box-sizing:border-box}html{background:var(--page)}body{margin:0;background:var(--page);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.site-shell{min-height:100vh}.site-header{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 28px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.94)}.site-header p{margin:0;color:var(--muted);font-size:13px}.brand{display:flex;align-items:center;gap:10px;padding:0;border:0;background:transparent;color:var(--text);font-weight:600;letter-spacing:-.02em;cursor:pointer}.brand-mark{position:relative;width:28px;height:28px;border:2px solid var(--accent);border-radius:8px}.brand-mark:after{content:"";position:absolute;top:12px;right:6px;left:6px;height:2px;background:var(--accent);transform:rotate(-18deg)}.feed,.detail{width:min(100% - 32px,690px);margin:0 auto;padding:42px 0 64px}.feed-intro{margin-bottom:22px}h1,h2,p{margin-top:0}.feed h1,.article-card h1{margin-bottom:7px;font-size:clamp(25px,5vw,31px);line-height:1.18;letter-spacing:-.035em}.feed-intro p,.article-card p,.language-note{color:var(--muted)}.feed-intro p{margin-bottom:0;font-size:14px}.link-list{display:grid;gap:14px}.link-card{display:grid;width:100%;padding:19px 20px 15px;text-align:left;color:var(--text);border:1px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color 140ms ease,transform 140ms ease}.link-card:hover{border-color:var(--accent);transform:translateY(-1px)}.link-card:focus-visible{outline:3px solid rgba(36,98,67,.2);outline-offset:2px}.domain{margin-bottom:7px;color:var(--muted);font-size:12px}.link-card>strong{font-size:18px;line-height:1.35;letter-spacing:-.015em}.description{margin-top:7px;color:var(--muted);font-size:13px;line-height:1.5}.card-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:15px;padding-top:12px;color:var(--muted);border-top:1px solid var(--border);font-size:12px}.open-label{margin-left:auto;color:var(--accent)}.back-button{margin-bottom:24px;padding:0;color:var(--accent);border:0;background:transparent;cursor:pointer}.article-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:23px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}.article-card p{margin-bottom:0;font-size:13px;line-height:1.55}.article-button{align-self:start;padding:10px 13px;color:#fff;border:0;border-radius:9px;background:var(--accent);cursor:pointer}.article-meta{display:flex;flex-wrap:wrap;grid-column:1/-1;gap:8px 20px;padding-top:14px;color:var(--muted);border-top:1px solid var(--border);font-size:12px}.language-note{margin:12px 2px 30px;font-size:12px;line-height:1.5}.conversation-list h2{margin-bottom:4px;font-size:18px;letter-spacing:-.02em}.conversation{padding:20px 2px;border-bottom:1px solid var(--border)}.conversation-author{display:flex;align-items:center;gap:10px}.conversation-author div{display:grid;gap:1px}.conversation-author strong{font-size:13px}.conversation-author div span{color:var(--muted);font-size:11px}.avatar{display:grid;place-items:center;width:30px;height:30px;color:var(--accent);border-radius:50%;background:var(--soft);font-size:10px;font-weight:600}.conversation>p{margin:10px 0 10px 40px;font-size:14px;line-height:1.55}.conversation-meta{display:flex;flex-wrap:wrap;gap:8px 17px;margin-left:40px;color:var(--muted);font-size:12px}.conversation-meta button{padding:0;color:var(--accent);border:0;background:transparent;cursor:pointer}.hidden{display:none}@media(max-width:560px){.site-header{height:60px;padding:0 16px}.site-header p{display:none}.feed,.detail{width:min(100% - 24px,690px);padding-top:28px}.article-card{grid-template-columns:1fr;padding:19px}.article-button{justify-self:start}.article-meta{grid-column:1}.open-label{width:100%;margin-left:0}}@media(prefers-reduced-motion:reduce){.link-card{transition:none}}
  </style>
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <button class="brand" id="brand" aria-label="Naar de linkfeed"><span class="brand-mark" aria-hidden="true"></span><span>Commonplace</span></button>
      <p>Waar mensen over praten.</p>
    </header>
    <section class="feed" id="feed" aria-labelledby="feed-title">
      <div class="feed-intro"><h1 id="feed-title">Vandaag besproken</h1><p>Links gedeeld in Nederlandstalige ATProto-berichten.</p></div>
      <div class="link-list" id="link-list"></div>
    </section>
    <section class="detail hidden" id="detail" aria-labelledby="detail-title">
      <button class="back-button" id="back">← Terug naar de links</button>
      <article class="article-card">
        <div><div class="domain" id="detail-domain"></div><h1 id="detail-title"></h1><p id="detail-description"></p></div>
        <button class="article-button">Lees artikel ↗</button>
        <div class="article-meta"><span id="detail-messages"></span><span id="detail-conversations"></span></div>
      </article>
      <p class="language-note">Alleen berichten die door de publicerende app expliciet als Nederlands zijn gemarkeerd. Commonplace bepaalt de taal niet zelf.</p>
      <div class="conversation-list"><h2>Gesprekken over deze link</h2><div id="conversations"></div></div>
    </section>
  </main>
  <script>
    const links=[
      {domain:'aeon.co',title:'Wat gebeurt er als AI onderdeel wordt van alledaagse beslissingen?',description:'Een essay over expertise, delegeren en de kleine keuzes die in geautomatiseerde systemen besloten liggen.',messages:84,conversations:[['NV','Noor van Dijk','@noor.bsky.social','2 u','Dit stuk verwoordt goed hoeveel kleine beslissingen we ongemerkt aan systemen overlaten.',31,'Bluesky'],['YA','Yassine Amrani','@yassine.eu','4 u','Maakt het artikel genoeg onderscheid tussen adviseren, aanbevelen en beslissen?',28,'mu'],['EV','Eva Vermeer','@eva.example','gisteren','Is het delegeren van beslissingen aan hulpmiddelen eigenlijk wel zo nieuw?',17,'Bluesky']]},
      {domain:'citylab.com',title:'De verrassende effecten van het schrappen van parkeernormen',description:'Nieuwe gegevens uit vier steden laten een ingewikkelder beeld zien dan verwacht.',messages:51,conversations:[['MB','Mo Bakker','@mobakker.nl','3 u','Rotterdam laat goed zien wat er gebeurt als parkeerplaatsen niet langer het uitgangspunt zijn.',19,'Bluesky'],['ID','Iris de Jong','@iris.eu','6 u','Benieuwd of de extra woningen ook echt betaalbaar zijn gebleven.',14,'mu'],['DS','Daniël Smit','@danielsmit.nl','gisteren','Deze vergelijking mist volgens mij de verschillen tussen stadsdelen.',8,'Bluesky']]},
      {domain:'reuters.com',title:'Een nieuw model voor de financiering van lokale journalistiek',description:'Coöperaties, publieke subsidies en abonnementen worden op nieuwe manieren gecombineerd.',messages:33,conversations:[['LK','Lieke Kramer','@liekekramer.nl','5 u','Dit lijkt op het model waarmee enkele Nederlandse lokale redacties nu experimenteren.',12,'Bluesky'],['SB','Sem Bos','@sembos.eu','8 u','Hoe voorkom je dat publieke financiering invloed krijgt op redactionele keuzes?',9,'mu'],['FE','Fatima El Idrissi','@fatima.example','gisteren','Het coöperatieve deel vind ik interessanter dan het abonnementsmodel.',7,'Bluesky']]}
    ];
    const feed=document.getElementById('feed'),detail=document.getElementById('detail'),list=document.getElementById('link-list');
    function showFeed(){detail.classList.add('hidden');feed.classList.remove('hidden');window.scrollTo(0,0)}
    function openLink(link){document.getElementById('detail-domain').textContent=link.domain;document.getElementById('detail-title').textContent=link.title;document.getElementById('detail-description').textContent=link.description;document.getElementById('detail-messages').textContent=`${link.messages} berichten`;document.getElementById('detail-conversations').textContent=`${link.conversations.length} afzonderlijke gesprekken`;document.getElementById('conversations').innerHTML=link.conversations.map(c=>`<article class="conversation"><div class="conversation-author"><span class="avatar" aria-hidden="true">${c[0]}</span><div><strong>${c[1]}</strong><span>${c[2]} · ${c[3]}</span></div></div><p>${c[4]}</p><div class="conversation-meta"><span>${c[5]} berichten</span><span>op ${c[6]}</span><button>Bekijk gesprek ↗</button></div></article>`).join('');feed.classList.add('hidden');detail.classList.remove('hidden');window.scrollTo(0,0)}
    links.forEach(link=>{const card=document.createElement('button');card.className='link-card';card.setAttribute('aria-label',`Open gesprekken over ${link.title}`);card.innerHTML=`<span class="domain">${link.domain}</span><strong>${link.title}</strong><span class="description">${link.description}</span><span class="card-meta"><span>${link.messages} berichten</span><span>${link.conversations.length} gesprekken</span><span class="open-label">Open →</span></span>`;card.addEventListener('click',()=>openLink(link));list.appendChild(card)});
    document.getElementById('back').addEventListener('click',showFeed);document.getElementById('brand').addEventListener('click',showFeed);
  </script>
</body>
</html>
