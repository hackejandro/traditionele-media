name: Update traditionele.media feed

on:
  schedule:
    # Reservetimer naast de lichte Cloudflare-trigger.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: traditionele-media-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest collector state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=collector-state&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > state.zip
            unzip -o state.zip -d work
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect and build feed
        run: node scripts/collect.mjs

      - name: Publish qualifying conversation
        env:
          BOT_MODE: live
          EUROSKY_APP_PASSWORD: ${{ secrets.EUROSKY_APP_PASSWORD }}
        run: node scripts/prepare-bot-post.mjs

      - name: Save collector state
        uses: actions/upload-artifact@v4
        with:
          name: collector-state
          path: |
            work/collector-state.json
            work/bot-state.json
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
