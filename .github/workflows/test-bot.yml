name: Test traditionele.media bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Eurosky login without posting
        env:
          EUROSKY_APP_PASSWORD: ${{ secrets.EUROSKY_APP_PASSWORD }}
        run: node scripts/test-bot-login.mjs
